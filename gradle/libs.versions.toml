####################################################################################################
# CopyEye version catalog
#
# Rules for this file:
#  - Stable releases only.
#  - Android Gradle Plugin 9.x ships Kotlin support built in, so `org.jetbrains.kotlin.android`
#    must NOT be applied. The bundled Kotlin version is 2.3.21 and every Kotlin compiler plugin
#    below is pinned to exactly that version.
#  - minSdk is Android 10 (API 29). Everything newer is version-gated at runtime, in one place:
#    core/common/ApiLevel.kt. See docs/LIMITATIONS.md for why 29 is the floor.
####################################################################################################

[versions]
# --- Build toolchain -----------------------------------------------------------------------------
agp = "9.3.1"                      # requires Gradle >= 9.5.0 (wrapper pins 9.6.1)
kotlin = "2.3.21"                  # must equal the Kotlin bundled inside AGP 9.3.1
javaToolchain = "21"
jvmTarget = "11"                   # keeps desugaring cheap for old-device support

# --- Android SDK ---------------------------------------------------------------------------------
compileSdk = "36"
targetSdk = "36"
minSdk = "29"                      # Android 10 — see docs/LIMITATIONS.md for why this is the floor

# --- AndroidX / Compose --------------------------------------------------------------------------
androidxCore = "1.17.0"
androidxActivity = "1.10.1"
androidxLifecycle = "2.9.4"
androidxNavigation = "2.9.5"
androidxDatastore = "1.1.7"
composeBom = "2025.09.01"

# --- Kotlin runtime ------------------------------------------------------------------------------
coroutines = "1.10.2"
kotlinxSerialization = "1.9.0"

# --- ML Kit (on-device OCR, bundled models — no Play Services dependency) -------------------------
mlkitTextRecognition = "16.0.1"

# --- Shizuku (optional shell-privileged capture) --------------------------------------------------
shizuku = "13.1.5"

# --- Testing -------------------------------------------------------------------------------------
junit4 = "4.13.2"
truth = "1.4.5"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestCore = "1.7.0"
androidxEspresso = "3.7.0"

[libraries]
# --- AndroidX core -------------------------------------------------------------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }

# --- Lifecycle -----------------------------------------------------------------------------------
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "androidxLifecycle" }

# --- Compose (versions come from the BOM) --------------------------------------------------------
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# --- Navigation ----------------------------------------------------------------------------------
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }

# --- DataStore -----------------------------------------------------------------------------------
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }

# --- Kotlin runtime ------------------------------------------------------------------------------
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# --- ML Kit --------------------------------------------------------------------------------------
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }
mlkit-text-recognition-devanagari = { group = "com.google.mlkit", name = "text-recognition-devanagari", version.ref = "mlkitTextRecognition" }

# --- Shizuku -------------------------------------------------------------------------------------
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

# --- Testing -------------------------------------------------------------------------------------
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxEspresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
